name: Docs Health Reports

# Produces reliability and agent-score JSON for the Devportal Health dashboard.
#
# Linkinator runs against a full build. AFDocs scores the production portal.
# Docusaurus internal checking remains on PRs via check-broken-links.yml.

on:
  schedule:
    # Mondays 06:00 UTC, after weekend documentation merges
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability-report:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build site + Linkinator crawl + Health JSON
        id: crawl
        continue-on-error: true
        run: yarn check-links:reliability
        env:
          MENDABLE_KEY: ${{ secrets.MENDABLE_KEY }}
          COOKBOOK_PUBLIC_API_KEY: ${{ secrets.COOKBOOK_PUBLIC_API_KEY }}
          GTM_CONTAINER_ID: ${{ secrets.GTM_CONTAINER_ID }}

      - name: Upload reliability artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-health-reliability
          path: artifacts/reliability.json
          if-no-files-found: warn
          retention-days: 90

      - name: Summarize for Actions UI
        if: always()
        run: |
          if [ -f artifacts/reliability.json ]; then
            node -e "
              const r = require('./artifacts/reliability.json');
              console.log('Reliability %:', r.reliabilityPercent);
              console.log('Valid/Total:', r.validLinks + '/' + r.totalLinks);
              console.log('Broken:', r.brokenLinks);
              console.log('Source:', r.source);
            "
          else
            echo 'No reliability.json produced'
            exit 1
          fi

      - name: Fail job if link check failed
        if: steps.crawl.outcome == 'failure'
        run: |
          echo "Linkinator reported broken links (see artifact + logs)."
          exit 1

  agent-score-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate AFDocs Agent Score JSON
        id: agent_score
        continue-on-error: true
        run: |
          rm -f artifacts/agent-score.json
          yarn check-agent-score

      - name: Upload agent score artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-health-agent-score
          path: artifacts/agent-score.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize agent score
        if: always()
        run: |
          if [ -f artifacts/agent-score.json ]; then
            node -e "
              const r = require('./artifacts/agent-score.json');
              console.log('Agent score:', r.overallScore + '/100', r.grade);
              console.log('Passed:', r.checksPassed);
              console.log('Warned:', r.checksWarned);
              console.log('Failed:', r.checksFailed);
              console.log('Errored:', r.checksErrored);
              console.log('Source:', r.source, r.sourceVersion);
            "
          else
            echo 'No agent-score.json produced'
            exit 1
          fi

      - name: Fail job if AFDocs reported issues
        if: steps.agent_score.outcome == 'failure'
        run: |
          echo "AFDocs reported a failed check (see artifact + logs)."
          exit 1
